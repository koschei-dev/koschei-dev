# Rebuilds the profile images once a day (and when the generator changes), so the
# status line under the panels shows today's date, the repo count and Organizy's latest release.
name: Refresh profile

on:
  schedule:
    - cron: "17 11 * * *"   # 07:17 in Santo Domingo
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools brotli
      - run: python3 scripts/build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Refresh profile images"
            git push
          fi
